<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ee3f85">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Our Love Story</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
    <link rel="apple-touch-icon" href="img/icon-180.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="boot">
    <img id="bg" alt="" aria-hidden="true">

    <!-- ===== МЕНЮ ПРОФИЛЯ ===== -->
    <div class="profile-menu-container" hidden>
        <button type="button" class="avatar-btn" id="avatarBtn" aria-label="Меню профиля" aria-haspopup="true" aria-expanded="false">
            <svg class="icon" id="avatarIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <img id="avatarImage" alt="" hidden>
        </button>
        <div class="dropdown-menu" id="profileDropdown" role="menu">
            <button type="button" class="dropdown-item" id="menuAccountBtn" role="menuitem">Аккаунт</button>
            <button type="button" class="dropdown-item" id="menuLogoutBtn" role="menuitem">Выйти</button>
        </div>
    </div>

    <!-- ===== ШАПКА ===== -->
    <header hidden>
        <nav>
            <a class="nav-btn" href="#home" data-page="home">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span class="tab-label">Home</span>
            </a>
            <a class="nav-btn" href="#notes" data-page="notes">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
                <span class="tab-label">Notes</span>
            </a>
            <a class="nav-btn" href="#gallery" data-page="gallery">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                <span class="tab-label">Gallery</span>
            </a>
            <a class="nav-btn" href="#timeline" data-page="timeline">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                <span class="tab-label">Timeline</span>
            </a>
        </nav>
    </header>

    <!-- ===== КНОПКИ НА ГЛАВНОЙ ===== -->
    <div class="admin-controls" id="mainControls" hidden>
        <button type="button" id="addMemoryBtn" class="main-add-btn">Add new memory</button>
        <button type="button" id="addGalleryBtn" class="main-add-btn">Add photo</button>
        <button type="button" id="addTimelineBtn" class="main-add-btn">Add event</button>
    </div>

    <main id="content"></main>
    <nav id="yearsPanel" class="years-menu" aria-label="Годы" hidden></nav>

    <!-- ===== ВХОД ===== -->
    <div id="loginModal" class="modal login-modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle" hidden>
        <form class="polaroid-frame" id="loginForm" novalidate>
            <div class="polaroid-footer">
                <h3 id="loginTitle">Вход</h3>
                <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required>
                <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password" required>
                <p class="form-error" id="loginError" role="alert"></p>
                <button type="submit" class="btn-save-polaroid" id="loginBtn">Войти</button>
            </div>
        </form>
    </div>

    <!-- ===== НАСТРОЙКИ АККАУНТА ===== -->
    <div id="accountModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="accountTitle" hidden>
        <form class="polaroid-frame" id="accountForm" novalidate>
            <button type="button" class="close-outside" data-close aria-label="Закрыть">&times;</button>
            <div class="polaroid-footer">
                <h3 id="accountTitle">Настройки аккаунта</h3>
                <div class="avatar-upload" id="avatarUploadArea" role="button" tabindex="0" aria-label="Изменить аватар">
                    <input type="file" id="avatarFileInput" accept="image/*" hidden>
                    <div class="avatar-preview-circle">
                        <img id="settingsAvatarPreview" alt="" hidden>
                        <svg class="icon" id="settingsAvatarIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                    </div>
                    <p id="avatarUploadText">Изменить аватар</p>
                </div>
                <label class="field-label" for="newEmail">Новый Email:</label>
                <input type="email" id="newEmail" placeholder="Оставьте пустым, если не меняете" autocomplete="email">
                <label class="field-label" for="newPassword">Новый Пароль:</label>
                <input type="password" id="newPassword" placeholder="Оставьте пустым, если не меняете" autocomplete="new-password">
                <p class="form-error" role="alert"></p>
                <button type="submit" class="btn-save-polaroid">Сохранить изменения</button>
            </div>
        </form>
    </div>

    <!-- ===== ФОРМА ВОСПОМИНАНИЯ ===== -->
    <div id="postModal" class="modal" role="dialog" aria-modal="true" aria-label="Воспоминание" hidden>
        <form class="polaroid-frame" id="postForm" novalidate>
            <button type="button" class="close-outside" data-close aria-label="Закрыть">&times;</button>
            <div class="polaroid-header">
                <input type="date" id="postDate" class="handwritten-date" required aria-label="Дата">
            </div>
            <div class="polaroid-photo-area" data-photo-area tabindex="0" role="button" aria-label="Выбрать фото">
                <input type="file" id="postImage" accept="image/*" hidden>
                <div class="polaroid-placeholder">
                    <span class="plus-icon">+</span>
                    <p class="placeholder-text">Добавить фото</p>
                </div>
                <img class="photo-preview" alt="" hidden>
                <button type="button" class="photo-remove" hidden>убрать фото</button>
            </div>
            <div class="polaroid-footer">
                <input type="text" id="postTitle" placeholder="Заголовок" class="handwritten-text title-input" maxlength="300">
                <textarea id="postText" placeholder="Напишите что-нибудь..." class="handwritten-text" required></textarea>
                <p class="form-error" role="alert"></p>
                <button type="submit" class="btn-save-polaroid">Опубликовать</button>
            </div>
        </form>
    </div>

    <!-- ===== ФОРМА ФОТО ===== -->
    <div id="galleryForm" class="modal" role="dialog" aria-modal="true" aria-label="Фото в галерею" hidden>
        <form class="polaroid-frame" id="galleryUploadForm" novalidate>
            <button type="button" class="close-outside" data-close aria-label="Закрыть">&times;</button>
            <div class="polaroid-photo-area" data-photo-area tabindex="0" role="button" aria-label="Выбрать фото">
                <input type="file" id="galleryImageFile" accept="image/*" multiple hidden>
                <div class="polaroid-placeholder">
                    <span class="plus-icon">+</span>
                    <p class="placeholder-text">Добавить фото</p>
                </div>
                <img class="photo-preview" alt="" hidden>
            </div>
            <div class="polaroid-footer">
                <div class="upload-progress" hidden><div class="upload-progress-bar"></div></div>
                <p class="form-error" role="alert"></p>
                <button type="submit" class="btn-save-polaroid">Опубликовать</button>
            </div>
        </form>
    </div>

    <!-- ===== ФОРМА СОБЫТИЯ ===== -->
    <div id="timelineModal" class="modal" role="dialog" aria-modal="true" aria-label="Событие" hidden>
        <form class="polaroid-frame" id="timelineForm" novalidate>
            <button type="button" class="close-outside" data-close aria-label="Закрыть">&times;</button>
            <div class="polaroid-header">
                <input type="date" id="timelineDate" class="handwritten-date" required aria-label="Дата">
            </div>
            <div class="polaroid-photo-area" data-photo-area tabindex="0" role="button" aria-label="Выбрать фото">
                <input type="file" id="timelineFile" accept="image/*" hidden>
                <div class="polaroid-placeholder">
                    <span class="plus-icon">+</span>
                    <p class="placeholder-text">Добавить фото</p>
                </div>
                <img class="photo-preview" alt="" hidden>
                <button type="button" class="photo-remove" hidden>убрать фото</button>
            </div>
            <div class="polaroid-footer">
                <input type="text" id="timelineTitle" placeholder="Заголовок" class="handwritten-text title-input" maxlength="300" required>
                <p class="form-error" role="alert"></p>
                <button type="submit" class="btn-save-polaroid">Опубликовать</button>
            </div>
        </form>
    </div>

    <!-- ===== ПОСТ ЦЕЛИКОМ ===== -->
    <div id="fullPostModal" class="modal" role="dialog" aria-modal="true" aria-label="Воспоминание" hidden>
        <div class="full-post-content">
            <button type="button" class="close-outside" data-close aria-label="Закрыть">&times;</button>
            <div class="full-post-body" id="fullPostBody"></div>
        </div>
    </div>

    <!-- ===== ФОТО НА ВЕСЬ ЭКРАН ===== -->
    <div id="fullscreenOverlay" class="full-image-overlay" role="dialog" aria-modal="true" aria-label="Просмотр фото" hidden>
        <button type="button" class="nav-arrow lightbox-arrow left-arrow" aria-label="Предыдущее">&#10094;</button>
        <div class="fullscreen-polaroid-wrapper">
            <img class="lightbox-img" alt="">
            <div class="lightbox-loader" hidden></div>
            <div class="delete-action-container gallery-delete-wrapper">
                <button type="button" class="micro-trigger-btn" aria-label="Действия">⋮</button>
                <button type="button" class="fullscreen-delete-btn">удалить</button>
            </div>
        </div>
        <button type="button" class="nav-arrow lightbox-arrow right-arrow" aria-label="Следующее">&#10095;</button>
        <button type="button" class="lightbox-close" data-close aria-label="Закрыть">&times;</button>
    </div>

    <!-- ===== ПОДТВЕРЖДЕНИЕ ===== -->
    <div id="confirmModal" class="modal confirm-modal" role="alertdialog" aria-modal="true" hidden>
        <div class="polaroid-frame confirm-card">
            <p class="confirm-text"></p>
            <div class="confirm-actions">
                <button type="button" class="btn-ghost" data-answer="no">Отмена</button>
                <button type="button" class="btn-save-polaroid btn-confirm" data-answer="yes">Удалить</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f63b3e"/>
                <stop offset="100%" stop-color="#f69fda"/>
            </linearGradient>
        </defs>
    </svg>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/images.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/posts.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
